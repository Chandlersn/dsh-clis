<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CLIS causal layers">
  <title>CLIS 因果分层</title>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0F172A"/>
  <!-- 三条因果层：对偶（上下）、循环（环）、单向（箭头） -->
  <circle cx="20" cy="20" r="5" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="20" cy="32" r="5" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
  <path d="M20 25 L20 27" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M20 37 L20 40" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 循环 -->
  <path d="M42 18 A8 8 0 1 1 34 26" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M34 26 l-3.5 -1.2 l1.4 3.6 z" fill="#FBBF24"/>
  <!-- 单向 -->
  <path d="M34 44 L50 44" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M50 44 l-4 -3 l0 6 z" fill="#34D399"/>
</svg>
